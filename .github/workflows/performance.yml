name: Performance Tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Get pip cache dir
      id: pip_cache
      run: |
        echo "::set-output name=dir::$(pip cache dir)"
    - name: Cache dependencies
      uses: actions/cache@v2
      with:
        path: ${{ steps.pip_cache.outputs.dir }}
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      working-directory: ./hk_port_digital_twin
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run performance tests
      working-directory: ./hk_port_digital_twin
      run: pytest --benchmark-only --benchmark-json=output.json

    - name: Upload benchmark results
      uses: actions/upload-artifact@v2
      with:
        name: benchmark-results
        path: hk_port_digital_twin/output.json

    - name: Compare benchmarks
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: hk_port_digital_twin/output.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        benchmark-data-dir-path: 'benchmarks'